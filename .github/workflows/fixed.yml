name: Fixed

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "25,55 * * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the flush tests
        run: python3 -m unittest -v tests.test_flush
