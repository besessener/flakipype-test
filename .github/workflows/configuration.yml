name: Configuration

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark the repository as checked
        run: gh label create sandbox-checked --force --color 0e8a16 --repo "$REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
