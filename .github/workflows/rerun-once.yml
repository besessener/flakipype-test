name: Rerun once

# Reruns the failed jobs of a case's first attempt once, as a person clicking "Re-run failed
# jobs" would. That gives flakipype "passed on rerun" evidence for the flaky cases and
# "still fails after a rerun" for the broken ones.
on:
  workflow_run:
    workflows: [Timing race, Random order, Network, Real bug, Fixed, Configuration]
    types: [completed]

permissions: {}

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Rerun the failed jobs
        run: gh run rerun "$RUN" --failed --repo "$REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
